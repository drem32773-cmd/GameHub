<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameHub — HTML игры</title>
<style>
:root{
  --bg:#0e1016; --panel:#161a23; --card:#1b202b; --border:#262c3a;
  --text:#e9ecf5; --muted:#8992a8; --accent:#6c5ce7; --accent-h:#7d6ff0;
  --green:#22c55e; --red:#ef4444; --yellow:#f59e0b;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  min-height:100vh;
}
button{font-family:inherit}
input,textarea{font-family:inherit}

/* ---------- TOPBAR ---------- */
.topbar{
  position:sticky; top:0; z-index:50;
  display:flex; align-items:center; gap:14px;
  padding:12px 20px; background:rgba(14,16,22,.85);
  backdrop-filter:blur(12px); border-bottom:1px solid var(--border);
}
.logo{
  font-size:20px; font-weight:800; letter-spacing:-.5px;
  background:linear-gradient(90deg,#a29bfe,#6c5ce7);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  cursor:pointer; white-space:nowrap;
}
.search{
  flex:1; max-width:420px; padding:9px 14px; border-radius:10px;
  background:var(--panel); border:1px solid var(--border);
  color:var(--text); outline:none; font-size:14px;
}
.search:focus{border-color:var(--accent)}
.top-actions{display:flex; gap:8px; margin-left:auto; align-items:center}

/* ---------- BUTTONS ---------- */
.btn{
  padding:9px 16px; border-radius:10px; border:1px solid var(--border);
  background:var(--panel); color:var(--text); cursor:pointer;
  font-size:14px; font-weight:600; transition:.15s; white-space:nowrap;
}
.btn:hover{background:#1e2330; border-color:#333b4d}
.btn-primary{background:var(--accent); border-color:var(--accent)}
.btn-primary:hover{background:var(--accent-h); border-color:var(--accent-h)}
.btn-danger{background:rgba(239,68,68,.12); border-color:rgba(239,68,68,.4); color:#ff8f8f}
.btn-danger:hover{background:rgba(239,68,68,.25)}
.btn-green{background:rgba(34,197,94,.12); border-color:rgba(34,197,94,.4); color:#7ee2a8}
.btn-green:hover{background:rgba(34,197,94,.25)}
.btn-sm{padding:6px 11px; font-size:13px; border-radius:8px}

/* ---------- LAYOUT ---------- */
main{padding:24px 20px 60px; max-width:1280px; margin:0 auto}
.hero{text-align:center; padding:26px 0 34px}
.hero h1{margin:0 0 8px; font-size:34px; letter-spacing:-1px}
.hero p{margin:0; color:var(--muted); font-size:15px}

.grid{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:18px;
}
.card{
  position:relative; background:var(--card); border:1px solid var(--border);
  border-radius:14px; overflow:hidden; cursor:pointer; transition:.18s;
}
.card:hover{transform:translateY(-4px); border-color:var(--accent); box-shadow:0 10px 30px rgba(108,92,231,.22)}
.cover{
  aspect-ratio:4/3; background:linear-gradient(135deg,#2a2f45,#1b202b);
  background-size:cover; background-position:center;
  display:flex; align-items:center; justify-content:center;
  font-size:46px; font-weight:800; color:#4b5473;
}
.card-body{padding:11px 13px 14px}
.card-body h3{
  margin:0 0 5px; font-size:14.5px; font-weight:700;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.meta{font-size:12px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.del-btn{
  position:absolute; top:8px; right:8px; width:28px; height:28px;
  border-radius:8px; border:none; background:rgba(239,68,68,.9); color:#fff;
  cursor:pointer; font-size:14px; font-weight:700; line-height:1;
}
.del-btn:hover{background:#ef4444}
.badge{
  position:absolute; top:8px; left:8px; padding:3px 9px; border-radius:20px;
  font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.4px;
}
.badge.pending{background:rgba(245,158,11,.9); color:#1a1200}
.badge.approved{background:rgba(34,197,94,.9); color:#04180c}
.badge.rejected{background:rgba(239,68,68,.9); color:#fff}
.empty{
  grid-column:1/-1; text-align:center; padding:50px 20px;
  color:var(--muted); border:1px dashed var(--border); border-radius:14px;
}

/* ---------- DEV PANEL ---------- */
.devbar{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:12px 16px; margin-bottom:22px; border-radius:12px;
  background:linear-gradient(90deg,rgba(108,92,231,.18),rgba(108,92,231,.05));
  border:1px solid rgba(108,92,231,.35); font-size:14px; font-weight:600;
}
.devbar .spacer{flex:1}
h2.sec{margin:30px 0 14px; font-size:18px; letter-spacing:-.3px}
.list{display:flex; flex-direction:column; gap:10px}
.row{
  display:flex; align-items:center; gap:14px; padding:12px 14px;
  background:var(--card); border:1px solid var(--border); border-radius:12px;
}
.row .thumb{
  width:52px; height:52px; border-radius:9px; flex-shrink:0;
  background:linear-gradient(135deg,#2a2f45,#1b202b); background-size:cover;
  background-position:center; display:flex; align-items:center; justify-content:center;
  font-weight:800; color:#4b5473;
}
.row .info{flex:1; min-width:0}
.row .info b{display:block; font-size:14.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.row .info span{font-size:12.5px; color:var(--muted)}
.row .acts{display:flex; gap:7px; flex-wrap:wrap}

/* ---------- MODAL ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(5,6,10,.78); backdrop-filter:blur(4px);
  display:flex; align-items:center; justify-content:center; padding:20px; z-index:200;
  animation:fade .15s ease;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--panel); border:1px solid var(--border); border-radius:16px;
  padding:24px; width:100%; max-width:420px; max-height:90vh; overflow-y:auto;
  animation:pop .18s cubic-bezier(.2,.9,.3,1.3);
}
@keyframes pop{from{transform:scale(.94); opacity:0}to{transform:scale(1); opacity:1}}
.modal.wide{max-width:1000px; padding:16px}
.modal h2{margin:0 0 18px; font-size:20px; letter-spacing:-.4px}
.form{display:flex; flex-direction:column; gap:13px}
.form label{display:flex; flex-direction:column; gap:6px; font-size:13px; color:var(--muted); font-weight:600}
.form input,.form textarea{
  padding:10px 13px; border-radius:10px; background:var(--bg);
  border:1px solid var(--border); color:var(--text); outline:none; font-size:14px;
}
.form input:focus,.form textarea:focus{border-color:var(--accent)}
.form textarea{resize:vertical; min-height:70px}
.form input[type=file]{padding:8px; font-size:13px}
.err{color:#ff8f8f; font-size:13px; min-height:16px}
.tabs{display:flex; gap:6px; margin-bottom:16px; background:var(--bg); padding:4px; border-radius:10px}
.tab{
  flex:1; padding:8px; border-radius:8px; border:none; background:transparent;
  color:var(--muted); cursor:pointer; font-size:14px; font-weight:600;
}
.tab.active{background:var(--accent); color:#fff}

/* ---------- PLAYER ---------- */
.play-head{display:flex; align-items:center; gap:12px; margin-bottom:12px}
.play-head h3{margin:0; font-size:16px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.game-frame{
  width:100%; height:min(76vh,700px); border:none; border-radius:12px;
  background:#000; display:block;
}

/* ---------- TOASTS ---------- */
#toasts{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); z-index:999; display:flex; flex-direction:column; gap:9px; align-items:center}
.toast{
  padding:11px 20px; border-radius:11px; background:var(--card);
  border:1px solid var(--border); font-size:14px; font-weight:600;
  box-shadow:0 10px 30px rgba(0,0,0,.5); animation:pop .2s ease;
}
.toast.ok{border-color:rgba(34,197,94,.5); color:#7ee2a8}
.toast.err{border-color:rgba(239,68,68,.5); color:#ff8f8f}

.user-chip{
  display:flex; align-items:center; gap:9px; padding:5px 6px 5px 12px;
  background:var(--panel); border:1px solid var(--border); border-radius:11px;
}
.avatar{
  width:29px; height:29px; border-radius:8px; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(135deg,#6c5ce7,#a29bfe); font-weight:800; font-size:13px; color:#fff;
}
@media(max-width:640px){
  .hero h1{font-size:25px}
  .search{max-width:none}
  .topbar{flex-wrap:wrap; gap:9px}
  .top-actions{width:100%; margin-left:0}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="logo" data-action="go-catalog">🎮 GameHub</div>
  <input class="search" id="search" placeholder="Поиск игр..." autocomplete="off">
  <div class="top-actions" id="topActions"></div>
</header>

<main id="app"></main>
<div id="modalRoot"></div>
<div id="toasts"></div>

<script>
/* =====================================================================
   НАСТРОЙКИ
   ===================================================================== */
const DEV_PASSWORD = '1210002341';   // пароль для входа в режим разработчика
const SESSION_KEY  = 'gh_session';
const DEV_KEY      = 'gh_dev';

/* =====================================================================
   IndexedDB
   ===================================================================== */
let db = null;

function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('gamehub', 1);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('users')) d.createObjectStore('users', { keyPath:'username' });
      if (!d.objectStoreNames.contains('games')) d.createObjectStore('games', { keyPath:'id' });
    };
    req.onsuccess = e => { db = e.target.result; resolve(); };
    req.onerror  = e => reject(e.target.error);
  });
}
const _st  = (n,m) => db.transaction(n,m).objectStore(n);
const dbPut = (n,v) => new Promise((res,rej)=>{ const r=_st(n,'readwrite').put(v); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
const dbGet = (n,k) => new Promise((res,rej)=>{ const r=_st(n,'readonly').get(k);  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
const dbAll = (n)   => new Promise((res,rej)=>{ const r=_st(n,'readonly').getAll();r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
const dbDel = (n,k) => new Promise((res,rej)=>{ const r=_st(n,'readwrite').delete(k); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); });

/* =====================================================================
   СОСТОЯНИЕ
   ===================================================================== */
const state = {
  user: null,        // {username, passHash, createdAt}
  isDev: false,
  games: [],
  users: [],
  search: '',
  view: 'catalog'    // 'catalog' | 'dev'
};

let activeURLs = [];   // objectURL'ы для обложек (чистятся при ре-рендере)
function objURL(blob){ const u = URL.createObjectURL(blob); activeURLs.push(u); return u; }
function revokeURLs(){ activeURLs.forEach(u => { try{URL.revokeObjectURL(u)}catch(e){} }); activeURLs = []; }

/* =====================================================================
   УТИЛИТЫ
   ===================================================================== */
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}
function uid(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id_' + Date.now().toString(36) + Math.random().toString(36).slice(2,10);
}
async function sha256(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
}
async function hashPass(s){
  if (window.crypto && crypto.subtle) {
    try { return await sha256(s); } catch(e){}
  }
  let h = 0;
  for (let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) | 0;
  return 'fb' + Math.abs(h).toString(16);
}
function fmtDate(ts){
  return new Date(ts).toLocaleDateString('ru-RU', {day:'2-digit', month:'2-digit', year:'numeric'});
}
function toast(msg, type=''){
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  document.getElementById('toasts').appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = '.3s'; setTimeout(()=>t.remove(), 300); }, 2600);
}
const statusLabel = s => ({pending:'На модерации', approved:'Одобрено', rejected:'Отклонено'}[s] || s);

/* =====================================================================
   МОДАЛКИ
   ===================================================================== */
function openModal(html, opts = {}){
  const root = document.getElementById('modalRoot');
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<div class="modal ${opts.wide ? 'wide' : ''}">${html}</div>`;
  ov.addEventListener('mousedown', e => {
    if (e.target === ov && opts.closable !== false) closeModal(ov);
  });
  root.appendChild(ov);
  document.body.style.overflow = 'hidden';
  return ov;
}
function closeModal(ov){
  if (!ov) return;
  if (ov._url) { try{ URL.revokeObjectURL(ov._url); }catch(e){} }
  ov.remove();
  if (!document.querySelector('.overlay')) document.body.style.overflow = '';
}
function closeAllModals(){
  document.querySelectorAll('.overlay').forEach(closeModal);
}

/* =====================================================================
   ЗАГРУЗКА ДАННЫХ
   ===================================================================== */
async function loadGames(){
  state.games = (await dbAll('games')).sort((a,b) => b.createdAt - a.createdAt);
}
async function loadUsers(){
  state.users = await dbAll('users');
}

/* =====================================================================
   РЕНДЕР
   ===================================================================== */
function render(){
  revokeURLs();
  renderTopActions();
  const app = document.getElementById('app');
  if (state.view === 'dev' && state.isDev) {
    app.innerHTML = devPanelHTML();
  } else {
    app.innerHTML = catalogHTML();
  }
}

function renderTopActions(){
  const el = document.getElementById('topActions');
  if (state.user) {
    el.innerHTML = `
      <button class="btn btn-primary" data-action="open-upload">+ Загрузить</button>
      <div class="user-chip">
        <div class="avatar">${esc(state.user.username[0].toUpperCase())}</div>
        <span style="font-size:13.5px;font-weight:700">${esc(state.user.username)}</span>
        <button class="btn btn-sm" data-action="my-games">Мои игры</button>
        ${state.isDev
          ? `<button class="btn btn-sm" data-action="go-dev">Админка</button>`
          : `<button class="btn btn-sm" data-action="dev-login">Разработчик</button>`}
        <button class="btn btn-sm btn-danger" data-action="logout">Выйти</button>
      </div>`;
  } else {
    el.innerHTML = `
      <button class="btn" data-action="open-auth" data-mode="login">Войти</button>
      <button class="btn btn-primary" data-action="open-auth" data-mode="reg">Регистрация</button>`;
  }
}

function catalogHTML(){
  const q = state.search.trim().toLowerCase();
  const games = state.games.filter(g => {
    if (!state.isDev && g.status !== 'approved') return false;
    if (!q) return true;
    return (g.title || '').toLowerCase().includes(q) || (g.author || '').toLowerCase().includes(q);
  });

  return `
    <section class="hero">
      <h1>Играй в HTML-игры</h1>
      <p>Загружай свои игры и делись ими с другими</p>
    </section>
    ${state.isDev ? `<div class="devbar">🛠 Режим разработчика активен <div class="spacer"></div>
        <button class="btn btn-sm btn-primary" data-action="go-dev">Панель управления</button>
        <button class="btn btn-sm btn-danger" data-action="exit-dev">Выйти из режима</button></div>` : ''}
    <div class="grid">
      ${games.length
        ? games.map(cardHTML).join('')
        : `<div class="empty">${q ? 'Ничего не найдено' : (state.isDev ? 'Игр пока нет' : 'Пока нет игр. Стань первым!')}</div>`}
    </div>`;
}

function cardHTML(g){
  const cover = g.coverBlob
    ? `style="background-image:url('${objURL(g.coverBlob)}')"`
    : '';
  const letter = esc((g.title || '?').trim()[0].toUpperCase());
  return `
  <article class="card" data-action="play" data-id="${g.id}">
    <div class="cover" ${cover}>${g.coverBlob ? '' : `<span>${letter}</span>`}
      ${state.isDev ? `<span class="badge ${g.status}">${statusLabel(g.status)}</span>` : ''}
    </div>
    <div class="card-body">
      <h3>${esc(g.title)}</h3>
      <div class="meta">${esc(g.author)} · ${g.plays || 0} игр</div>
    </div>
    ${state.isDev ? `<button class="del-btn" data-action="delete" data-id="${g.id}" title="Удалить">✕</button>` : ''}
  </article>`;
}

function devPanelHTML(){
  const pending  = state.games.filter(g => g.status === 'pending');
  const approved = state.games.filter(g => g.status === 'approved');
  const rejected = state.games.filter(g => g.status === 'rejected');

  return `
  <div class="devbar">
    🛠 Режим разработчика
    <div class="spacer"></div>
    <button class="btn btn-sm" data-action="go-catalog">← В каталог</button>
    <button class="btn btn-sm btn-danger" data-action="exit-dev">Выйти из режима</button>
  </div>

  <h2 class="sec">⏳ На модерации (${pending.length})</h2>
  <div class="list">
    ${pending.length ? pending.map(modRowHTML).join('') : '<div class="empty">Нет заявок на модерацию</div>'}
  </div>

  <h2 class="sec">✅ Одобренные игры (${approved.length})</h2>
  <div class="list">
    ${approved.length ? approved.map(adminRowHTML).join('') : '<div class="empty">Пусто</div>'}
  </div>

  <h2 class="sec">❌ Отклонённые (${rejected.length})</h2>
  <div class="list">
    ${rejected.length ? rejected.map(adminRowHTML).join('') : '<div class="empty">Пусто</div>'}
  </div>

  <h2 class="sec">👥 Пользователи (${state.users.length})</h2>
  <div class="list">
    ${state.users.length ? state.users.map(u => `
      <div class="row">
        <div class="thumb">${esc(u.username[0].toUpperCase())}</div>
        <div class="info">
          <b>${esc(u.username)}</b>
          <span>Зарегистрирован ${fmtDate(u.createdAt)} · Игр: ${state.games.filter(g=>g.author===u.username).length}</span>
        </div>
        <div class="acts">
          <button class="btn btn-sm btn-danger" data-action="del-user" data-user="${esc(u.username)}">Удалить</button>
        </div>
      </div>`).join('') : '<div class="empty">Пользователей нет</div>'}
  </div>`;
}

function modRowHTML(g){
  const thumb = g.coverBlob
    ? `style="background-image:url('${objURL(g.coverBlob)}')"`
    : '';
  return `
  <div class="row">
    <div class="thumb" ${thumb}>${g.coverBlob ? '' : esc((g.title||'?')[0].toUpperCase())}</div>
    <div class="info">
      <b>${esc(g.title)}</b>
      <span>Автор: ${esc(g.author)} · ${fmtDate(g.createdAt)}</span>
    </div>
    <div class="acts">
      <button class="btn btn-sm btn-green"  data-action="approve" data-id="${g.id}">✓ Принять</button>
      <button class="btn btn-sm btn-danger" data-action="reject"  data-id="${g.id}">✕ Отклонить</button>
      <button class="btn btn-sm"            data-action="play"    data-id="${g.id}">▶ Играть</button>
      <button class="btn btn-sm btn-danger" data-action="delete"  data-id="${g.id}">🗑 Удалить</button>
    </div>
  </div>`;
}

function adminRowHTML(g){
  const thumb = g.coverBlob
    ? `style="background-image:url('${objURL(g.coverBlob)}')"`
    : '';
  return `
  <div class="row">
    <div class="thumb" ${thumb}>${g.coverBlob ? '' : esc((g.title||'?')[0].toUpperCase())}</div>
    <div class="info">
      <b>${esc(g.title)}</b>
      <span>Автор: ${esc(g.author)} · ${fmtDate(g.createdAt)} · ${g.plays || 0} запусков · ${statusLabel(g.status)}</span>
    </div>
    <div class="acts">
      <button class="btn btn-sm"            data-action="play"   data-id="${g.id}">▶ Играть</button>
      ${g.status === 'rejected' ? `<button class="btn btn-sm btn-green" data-action="approve" data-id="${g.id}">✓ Одобрить</button>` : ''}
      <button class="btn btn-sm btn-danger" data-action="delete" data-id="${g.id}">🗑 Удалить</button>
    </div>
  </div>`;
}

/* =====================================================================
   ДЕЙСТВИЯ
   ===================================================================== */
document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action;
  const id = el.dataset.id;

  switch (a) {

    /* --- навигация --- */
    case 'go-catalog':
      state.view = 'catalog';
      render();
      break;

    case 'go-dev':
      if (!state.isDev) { toast('Нет доступа', 'err'); return; }
      state.view = 'dev';
      await loadUsers();
      render();
      break;

    case 'dev-login':
      openDevLogin();
      break;

    case 'exit-dev':
      state.isDev = false;
      state.view = 'catalog';
      sessionStorage.removeItem(DEV_KEY);
      render();
      toast('Вы вышли из режима разработчика');
      break;

    /* --- авторизация --- */
    case 'open-auth':
      openAuth(el.dataset.mode);
      break;

    case 'auth-tab':
      closeAllModals();
      openAuth(el.dataset.mode);
      break;

    case 'logout':
      state.user = null;
      localStorage.removeItem(SESSION_KEY);
      state.view = 'catalog';
      render();
      toast('Вы вышли из аккаунта');
      break;

    case 'my-games':
      openMyGames();
      break;

    case 'open-upload':
      openUpload();
      break;

    /* --- модерация --- */
    case 'approve': {
      const g = await dbGet('games', id);
      if (g) { g.status = 'approved'; await dbPut('games', g); await loadGames(); render(); toast('Игра одобрена', 'ok'); }
      break;
    }
    case 'reject': {
      const g = await dbGet('games', id);
      if (g) { g.status = 'rejected'; await dbPut('games', g); await loadGames(); render(); toast('Игра отклонена'); }
      break;
    }
    case 'delete': {
      if (!state.isDev) { toast('Только для разработчика', 'err'); return; }
      const g = await dbGet('games', id);
      if (!g) return;
      if (!confirm(`Удалить игру «${g.title}» навсегда?`)) return;
      await dbDel('games', id);
      await loadGames();
      render();
      toast('Игра удалена');
      break;
    }
    case 'del-user': {
      const uname = el.dataset.user;
      if (!confirm(`Удалить пользователя «${uname}»?`)) return;
      await dbDel('users', uname);
      await loadUsers();
      render();
      toast('Пользователь удалён');
      break;
    }

    /* --- игра --- */
    case 'play':
      playGame(id);
      break;

    case 'close-modal': {
      const ov = el.closest('.overlay');
      closeModal(ov);
      break;
    }
  }
});

/* Закрытие по Escape */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    const ovs = document.querySelectorAll('.overlay');
    if (ovs.length) closeModal(ovs[ovs.length - 1]);
  }
});

/* Поиск */
document.getElementById('search').addEventListener('input', e => {
  state.search = e.target.value;
  if (state.view === 'catalog') render();
});

/* =====================================================================
   АВТОРИЗАЦИЯ
   ===================================================================== */
function openAuth(mode = 'login'){
  const ov = openModal(`
    <h2>${mode === 'login' ? 'Вход в аккаунт' : 'Создать аккаунт'}</h2>
    <div class="tabs">
      <button class="tab ${mode==='login'?'active':''}" data-action="auth-tab" data-mode="login">Вход</button>
      <button class="tab ${mode==='reg'?'active':''}"   data-action="auth-tab" data-mode="reg">Регистрация</button>
    </div>
    <form class="form" id="authForm" autocomplete="off">
      <label>Имя пользователя
        <input id="auName" required minlength="3" maxlength="20" placeholder="например, player123">
      </label>
      <label>Пароль
        <input id="auPass" type="password" required minlength="4" placeholder="минимум 4 символа">
      </label>
      <div class="err" id="auErr"></div>
      <button class="btn btn-primary" type="submit">
        ${mode === 'login' ? 'Войти' : 'Создать аккаунт'}
      </button>
    </form>
  `);

  ov.querySelector('#authForm').addEventListener('submit', async ev => {
    ev.preventDefault();
    const name = ov.querySelector('#auName').value.trim();
    const pass = ov.querySelector('#auPass').value;
    const errEl = ov.querySelector('#auErr');
    errEl.textContent = '';

    if (name.length < 3) { errEl.textContent = 'Имя минимум 3 символа'; return; }
    if (pass.length < 4) { errEl.textContent = 'Пароль минимум 4 символа'; return; }

    const hash = await hashPass(pass);
    const existing = await dbGet('users', name);

    if (mode === 'reg') {
      if (existing) { errEl.textContent = 'Такое имя уже занято'; return; }
      const user = { username: name, passHash: hash, createdAt: Date.now() };
      await dbPut('users', user);
      state.user = user;
      localStorage.setItem(SESSION_KEY, name);
      closeModal(ov);
      render();
      toast(`Добро пожаловать, ${name}!`, 'ok');
    } else {
      if (!existing || existing.passHash !== hash) {
        errEl.textContent = 'Неверное имя пользователя или пароль';
        return;
      }
      state.user = existing;
      localStorage.setItem(SESSION_KEY, name);
      closeModal(ov);
      render();
      toast(`С возвращением, ${name}!`, 'ok');
    }
  });
}

/* =====================================================================
   РЕЖИМ РАЗРАБОТЧИКА
   ===================================================================== */
function openDevLogin(){
  const ov = openModal(`
    <h2>🛠 Режим разработчика</h2>
    <form class="form" id="devForm" autocomplete="off">
      <label>Пароль разработчика
        <input id="devPass" type="password" required placeholder="••••••••">
      </label>
      <div class="err" id="devErr"></div>
      <button class="btn btn-primary" type="submit">Войти</button>
    </form>
  `);

  ov.querySelector('#devForm').addEventListener('submit', async ev => {
    ev.preventDefault();
    const pass = ov.querySelector('#devPass').value;
    const errEl = ov.querySelector('#devErr');

    if (pass === DEV_PASSWORD) {
      state.isDev = true;
      state.view = 'dev';
      sessionStorage.setItem(DEV_KEY, '1');
      closeModal(ov);
      await loadUsers();
      render();
      toast('Режим разработчика включён', 'ok');
    } else {
      errEl.textContent = 'Неверный пароль';
      ov.querySelector('#devPass').value = '';
    }
  });
}

/* =====================================================================
   ЗАГРУЗКА ИГРЫ
   ===================================================================== */
function openUpload(){
  if (!state.user) { openAuth('login'); return; }

  const ov = openModal(`
    <h2>Загрузить игру</h2>
    <form class="form" id="upForm" autocomplete="off">
      <label>Название игры
        <input id="upTitle" required maxlength="60" placeholder="Моя крутая игра">
      </label>
      <label>Описание
        <textarea id="upDesc" maxlength="300" placeholder="Коротко о том, что это за игра..."></textarea>
      </label>
      <label>HTML-файл игры (.html)
        <input id="upFile" type="file" accept=".html,.htm,text/html" required>
      </label>
      <label>Обложка (необязательно)
        <input id="upCover" type="file" accept="image/*">
      </label>
      <div class="err" id="upErr"></div>
      <button class="btn btn-primary" type="submit">Отправить</button>
    </form>
  `);

  ov.querySelector('#upForm').addEventListener('submit', async ev => {
    ev.preventDefault();
    const errEl = ov.querySelector('#upErr');
    errEl.textContent = '';

    const title = ov.querySelector('#upTitle').value.trim();
    const desc  = ov.querySelector('#upDesc').value.trim();
    const file  = ov.querySelector('#upFile').files[0];
    const cover = ov.querySelector('#upCover').files[0];

    if (!title) { errEl.textContent = 'Введите название'; return; }
    if (!file)  { errEl.textContent = 'Выберите HTML-файл'; return; }
    if (file.size > 25 * 1024 * 1024) { errEl.textContent = 'Файл слишком большой (макс. 25 МБ)'; return; }

    const game = {
      id: uid(),
      title,
      description: desc,
      author: state.user.username,
      fileBlob: file,
      fileName: file.name,
      coverBlob: cover || null,
      status: state.isDev ? 'approved' : 'pending',
      createdAt: Date.now(),
      plays: 0
    };

    try {
      await dbPut('games', game);
      await loadGames();
      closeModal(ov);
      render();
      toast(state.isDev ? 'Игра опубликована!' : 'Игра отправлена на модерацию', 'ok');
    } catch (err) {
      errEl.textContent = 'Ошибка сохранения: ' + err.message;
    }
  });
}

/* =====================================================================
   МОИ ИГРЫ
   ===================================================================== */
function openMyGames(){
  if (!state.user) return;
  const mine = state.games.filter(g => g.author === state.user.username);
  openModal(`
    <h2>Мои игры (${mine.length})</h2>
    <div class="list">
      ${mine.length ? mine.map(g => `
        <div class="row">
          <div class="thumb">${esc((g.title||'?')[0].toUpperCase())}</div>
          <div class="info">
            <b>${esc(g.title)}</b>
            <span>${statusLabel(g.status)} · ${g.plays || 0} запусков</span>
          </div>
          <div class="acts">
            <button class="btn btn-sm" data-action="play" data-id="${g.id}">▶</button>
          </div>
        </div>`).join('') : '<div class="empty">Вы ещё не загрузили ни одной игры</div>'}
    </div>
  `);
}

/* =====================================================================
   ЗАПУСК ИГРЫ
   ===================================================================== */
async function playGame(id){
  const g = await dbGet('games', id);
  if (!g) { toast('Игра не найдена', 'err'); return; }
  if (!state.isDev && g.status !== 'approved') { toast('Игра ещё не одобрена', 'err'); return; }

  const url = URL.createObjectURL(g.fileBlob);

  const ov = openModal(`
    <div class="play-head">
      <h3>${esc(g.title)}</h3>
      <button class="btn btn-sm" data-action="close-modal">✕ Закрыть</button>
    </div>
    <iframe class="game-frame" src="${url}"
      sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-popups allow-forms allow-modals allow-orientation-lock"
      allowfullscreen></iframe>
  `, { wide: true });

  ov._url = url;

  g.plays = (g.plays || 0) + 1;
  await dbPut('games', g);
  const inState = state.games.find(x => x.id === id);
  if (inState) inState.plays = g.plays;
}

/* =====================================================================
   ИНИЦИАЛИЗАЦИЯ
   ===================================================================== */
(async function init(){
  try {
    await openDB();
  } catch (e) {
    document.getElementById('app').innerHTML =
      '<div class="empty">Не удалось открыть базу данных браузера.<br>Попробуйте другой браузер или режим инкогнито.</div>';
    return;
  }

  const sess = localStorage.getItem(SESSION_KEY);
  if (sess) {
    const u = await dbGet('users', sess);
    if (u) state.user = u;
    else localStorage.removeItem(SESSION_KEY);
  }

  state.isDev = sessionStorage.getItem(DEV_KEY) === '1';

  await loadGames();
  await loadUsers();
  render();
})();
</script>
