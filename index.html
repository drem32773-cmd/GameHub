<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GameHub — платформа HTML-игр</title>
<style>
:root{
  --bg:#0e1016; --bg2:#151925; --bg3:#1d2233; --line:#2a3145;
  --txt:#e8ecf6; --muted:#8b94ad; --acc:#6c5ce7; --acc2:#00d2ff;
  --ok:#22c55e; --warn:#f59e0b; --err:#ef4444; --r:14px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--txt);min-height:100vh;
  background-image:radial-gradient(circle at 15% -10%,rgba(108,92,231,.18),transparent 45%),
                   radial-gradient(circle at 90% 0%,rgba(0,210,255,.10),transparent 40%);
  background-attachment:fixed;
}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}

.top{position:sticky;top:0;z-index:50;background:rgba(14,16,22,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:16px;height:66px}
.logo{font-size:20px;font-weight:800;text-decoration:none;display:flex;align-items:center;gap:9px;white-space:nowrap}
.logo-mark{font-size:24px}
.grad{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.search{flex:1;max-width:380px}
.search input{width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);color:var(--txt);outline:none;font-size:14px;font-family:inherit;transition:.15s}
.search input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(108,92,231,.15)}
.nav{display:flex;gap:8px;margin-left:auto;align-items:center;flex-wrap:wrap}

.btn{
  padding:9px 16px;border-radius:10px;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--acc),#8b7cf6);color:#fff;
  font-weight:600;font-size:14px;font-family:inherit;transition:.15s;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
}
.btn:hover{filter:brightness(1.15);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:var(--bg3);color:var(--txt);border:1px solid var(--line)}
.btn.ghost:hover{background:#252b3d;filter:none}
.btn.ok{background:linear-gradient(135deg,#16a34a,#22c55e)}
.btn.err{background:linear-gradient(135deg,#dc2626,#ef4444)}
.btn.warn{background:linear-gradient(135deg,#d97706,#f59e0b)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.inp{
  width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg2);color:var(--txt);outline:none;font-size:14px;
  font-family:inherit;margin-bottom:14px;transition:.15s;
}
.inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(108,92,231,.15)}
textarea.inp{resize:vertical;min-height:80px}
input[type=file].inp{padding:9px}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:7px;text-transform:uppercase;letter-spacing:.4px}

main{padding:28px 0 70px}
.muted{color:var(--muted);font-size:14px}
h1{font-size:30px;margin:0 0 8px;letter-spacing:-.5px}
h2{font-size:20px;margin:0}
h3{font-size:17px;margin:0 0 10px}

.hero{
  background:linear-gradient(135deg,rgba(108,92,231,.16),rgba(0,210,255,.07));
  border:1px solid var(--line);border-radius:20px;padding:34px 30px;margin-bottom:32px;
}
.hero h1{font-size:34px}
.hero p{color:var(--muted);margin:0 0 20px;max-width:560px;line-height:1.55}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:18px}
.card{
  background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;cursor:pointer;transition:.18s;display:flex;flex-direction:column;position:relative;
}
.card:hover{transform:translateY(-4px);border-color:var(--acc);box-shadow:0 14px 32px rgba(108,92,231,.28)}
.cover{
  aspect-ratio:16/10;background:linear-gradient(135deg,#2b2350,#16233d);
  display:flex;align-items:center;justify-content:center;
  font-size:46px;font-weight:800;color:rgba(255,255,255,.22);overflow:hidden;
}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.card-body{padding:12px 14px 14px}
.card-title{font-weight:700;font-size:15px;margin-bottom:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-meta{color:var(--muted);font-size:12.5px;display:flex;justify-content:space-between;gap:8px}
.card-meta .saved{color:#a89bff;font-weight:700}

.empty{
  text-align:center;padding:60px 20px;color:var(--muted);font-size:16px;
  border:1px dashed var(--line);border-radius:var(--r);background:rgba(21,25,37,.5);
}

.panel{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:26px;max-width:640px}
.panel.wide{max-width:none}

.game-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:18px 0 14px;flex-wrap:wrap}
.game-frame{
  width:100%;height:70vh;min-height:420px;border-radius:var(--r);overflow:hidden;
  border:1px solid var(--line);background:#000;
}
.game-frame iframe{width:100%;height:100%;border:0;display:block;background:#000}
.game-frame:fullscreen{border-radius:0;height:100vh}
.game-actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.desc{color:var(--muted);line-height:1.6;margin-top:18px;white-space:pre-wrap}

.progress-bar{
  display:flex;align-items:center;gap:12px;margin-top:16px;padding:13px 16px;
  border-radius:11px;font-size:13.5px;flex-wrap:wrap;
  background:rgba(108,92,231,.10);border:1px solid rgba(108,92,231,.30);
  transition:.3s;
}
.progress-bar.flash{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.5)}
.progress-bar .icon{font-size:18px}
.progress-bar .txt{flex:1;min-width:180px;line-height:1.45}
.progress-bar code{
  background:rgba(0,0,0,.32);padding:2px 6px;border-radius:4px;font-size:12.5px;
  font-family:ui-monospace,Consolas,monospace;
}
.progress-bar.guest{background:rgba(245,158,11,.10);border-color:rgba(245,158,11,.35)}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
.badge.pending{background:rgba(245,158,11,.16);color:#fbbf24}
.badge.approved{background:rgba(34,197,94,.16);color:#4ade80}
.badge.rejected{background:rgba(239,68,68,.16);color:#f87171}
.badge.dev{background:rgba(108,92,231,.2);color:#a89bff}

.auth-wrap{display:flex;justify-content:center;padding-top:20px}
.auth{width:100%;max-width:420px;background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:30px}
.tabs{display:flex;gap:6px;background:var(--bg3);padding:5px;border-radius:11px;margin-bottom:22px}
.tabs button{
  flex:1;padding:9px;border:none;background:transparent;color:var(--muted);
  border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;font-family:inherit;transition:.15s;
}
.tabs button.active{background:var(--acc);color:#fff}

.dev-item{
  background:var(--bg2);border:1px solid var(--line);border-radius:12px;
  padding:16px;margin-bottom:12px;display:flex;gap:16px;align-items:flex-start;
}
.dev-item .cover-mini{
  width:78px;height:58px;border-radius:9px;flex-shrink:0;overflow:hidden;
  background:linear-gradient(135deg,#2b2350,#16233d);display:flex;align-items:center;
  justify-content:center;font-weight:800;color:rgba(255,255,255,.25);font-size:22px;
}
.dev-item .cover-mini img{width:100%;height:100%;object-fit:cover}
.dev-item-info{flex:1;min-width:0}
.dev-item-info .t{font-weight:700;margin-bottom:4px}
.dev-item-info .d{color:var(--muted);font-size:13px;line-height:1.5;margin-top:6px;word-break:break-word}
.dev-item-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;flex-shrink:0}

table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
tr:last-child td{border-bottom:none}

.overlay{
  position:fixed;inset:0;background:rgba(5,6,10,.75);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;
  animation:fade .18s ease;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--bg2);border:1px solid var(--line);border-radius:18px;
  padding:28px;width:100%;max-width:420px;animation:pop .2s ease;
  box-shadow:0 24px 70px rgba(0,0,0,.6);
}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}

.toasts{position:fixed;bottom:22px;right:22px;z-index:300;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.toast{
  background:var(--bg3);border:1px solid var(--line);border-left:4px solid var(--acc);
  padding:13px 18px;border-radius:11px;font-size:14px;font-weight:600;
  box-shadow:0 10px 30px rgba(0,0,0,.5);transition:.3s;max-width:330px;
  animation:slideIn .25s ease;
}
@keyframes slideIn{from{transform:translateX(30px);opacity:0}to{transform:translateX(0);opacity:1}}
.toast.ok{border-left-color:var(--ok)}
.toast.err{border-left-color:var(--err)}
.toast.warn{border-left-color:var(--warn)}

.notice{
  background:rgba(108,92,231,.12);border:1px solid rgba(108,92,231,.35);
  color:#b6adff;padding:12px 16px;border-radius:10px;font-size:14px;margin-bottom:20px;
}

@media(max-width:760px){
  .top-in{height:auto;padding:12px 0;flex-wrap:wrap}
  .search{order:3;max-width:none;flex-basis:100%}
  .nav{margin-left:0}
  .hero{padding:26px 20px}
  .hero h1{font-size:26px}
  .dev-item{flex-direction:column}
  .dev-item-actions{justify-content:flex-start}
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap top-in">
    <a class="logo" href="#" onclick="go('catalog');return false">
      <span class="logo-mark">🎮</span> Game<span class="grad">Hub</span>
    </a>
    <div class="search">
      <input id="searchInput" placeholder="Поиск игр..." oninput="onSearch(this.value)">
    </div>
    <nav class="nav" id="nav"></nav>
  </div>
</header>

<main class="wrap" id="app"></main>
<div class="toasts" id="toasts"></div>
<div id="modalRoot"></div>

<script>
/* =========================================================
   GameHub — платформа HTML-игр
   Прогресс сохраняется per-account через localStorage.
   API игры: GameHub.save(obj) / GameHub.load(cb) / GameHub.reset()
   ========================================================= */

const DEV_PASSWORD   = '1210002341';
const MAX_HTML_SIZE  = 3 * 1024 * 1024;
const MAX_COVER_SIZE = 400 * 1024;

const LS = {
  get(k, def){
    try{ const v = localStorage.getItem(k); return v === null ? def : JSON.parse(v); }
    catch(e){ return def; }
  },
  set(k, v){
    try{ localStorage.setItem(k, JSON.stringify(v)); return true; }
    catch(e){ return false; }
  }
};

const state = {
  users:   LS.get('gh_users', []),
  games:   LS.get('gh_games', []),
  session: LS.get('gh_session', null),
  view:    'catalog',
  current: null,
  search:  '',
  devTab:  'pending',
  authTab: 'login'
};

let currentBlobUrl = null;

function saveUsers(){ if(!LS.set('gh_users', state.users)) toast('Не удалось сохранить данные', 'err'); }
function saveGames(){ if(!LS.set('gh_games', state.games)) toast('Не удалось сохранить данные', 'err'); }

/* ---------- утилиты ---------- */
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function hash(str){
  let h = 0;
  for (let i = 0; i < str.length; i++){ h = ((h << 5) - h) + str.charCodeAt(i); h |= 0; }
  return 'h' + Math.abs(h).toString(36) + '_' + str.length;
}
function fmtDate(ts){
  return new Date(ts).toLocaleDateString('ru-RU', {day:'2-digit', month:'2-digit', year:'numeric'});
}
function me(){ return state.users.find(u => u.id === state.session) || null; }
function getGame(id){ return state.games.find(g => g.id === id) || null; }
function isDev(){ const u = me(); return !!(u && u.isDev); }
function plural(n, one, few, many){
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
  return many;
}

function toast(msg, type){
  type = type || 'ok';
  const box = document.getElementById('toasts');
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  box.appendChild(t);
  setTimeout(() => {
    t.style.opacity = '0';
    t.style.transform = 'translateX(24px)';
    setTimeout(() => t.remove(), 320);
  }, 2700);
}

function openModal(html){
  document.getElementById('modalRoot').innerHTML =
    '<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">' + html + '</div></div>';
}
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }

/* =========================================================
   ПРОГРЕСС — прямое чтение/запись в localStorage
   (iframe грузится с allow-same-origin, поэтому origin общий)
   ========================================================= */
function progressKey(userId, gameId){ return 'gh_progress_' + userId + '_' + gameId; }

function hasProgress(gameId){
  const u = me();
  if (!u) return false;
  try{ return localStorage.getItem(progressKey(u.id, gameId)) !== null; }
  catch(e){ return false; }
}

function loadProgress(gameId){
  const u = me();
  if (!u) return null;
  try{
    const raw = localStorage.getItem(progressKey(u.id, gameId));
    return raw === null ? null : JSON.parse(raw);
  }catch(e){ return null; }
}

function saveProgress(gameId, data){
  const u = me();
  if (!u) return false;
  try{
    localStorage.setItem(progressKey(u.id, gameId), JSON.stringify(data));
    return true;
  }catch(e){ return false; }
}

function resetProgress(gameId){
  const u = me();
  if (!u) return false;
  try{ localStorage.removeItem(progressKey(u.id, gameId)); return true; }
  catch(e){ return false; }
}

/* ---------- сборка скрипта-API для игры ---------- */
function buildApiScript(userId, gameId){
  const key = userId ? progressKey(userId, gameId) : '';
  const s = [
    '<script>',
    '(function(){',
    '  var USER_ID = ' + JSON.stringify(userId) + ';',
    '  var GAME_ID = ' + JSON.stringify(gameId) + ';',
    '  var KEY = ' + JSON.stringify(key) + ';',
    '  function notify(type, detail){',
    '    try{ window.parent.postMessage({source:"gamehub",type:type,gameId:GAME_ID,detail:detail},"*"); }catch(e){}',
    '  }',
    '  var api = {',
    '    userId: USER_ID,',
    '    gameId: GAME_ID,',
    '    isLoggedIn: !!USER_ID,',
    '    save: function(data){',
    '      if(!USER_ID){ console.warn("GameHub: сохранение недоступно (не выполнен вход)"); return false; }',
    '      try{',
    '        localStorage.setItem(KEY, JSON.stringify(data));',
    '        notify("save", data);',
    '        return true;',
    '      }catch(e){ console.error("GameHub save error:", e); return false; }',
    '    },',
    '    load: function(cb){',
    '      var data = null;',
    '      if(USER_ID){',
    '        try{',
    '          var raw = localStorage.getItem(KEY);',
    '          data = raw === null ? null : JSON.parse(raw);',
    '        }catch(e){ console.error("GameHub load error:", e); }',
    '      }',
    '      if(typeof cb === "function"){ try{ cb(data); }catch(e){ console.error(e); } }',
    '      notify("load", data);',
    '      return data;',
    '    },',
    '    reset: function(){',
    '      if(!USER_ID) return false;',
    '      try{ localStorage.removeItem(KEY); notify("reset", null); return true; }',
    '      catch(e){ return false; }',
    '    }',
    '  };',
    '  window.GameHub = api;',
    '  window.dispatchEvent(new Event("gamehub-ready"));',
    '})();',
    '<\/script>'
  ].join('\n');
  return s;
}

function buildGameSrc(html, userId, gameId){
  const api = buildApiScript(userId, gameId);
  let out = html;
  if (/<head[^>]*>/i.test(out)){
    out = out.replace(/<head[^>]*>/i, m => m + '\n' + api);
  } else if (/<html[^>]*>/i.test(out)){
    out = out.replace(/<html[^>]*>/i, m => m + '<head>' + api + '</head>');
  } else {
    out = api + out;
  }
  return URL.createObjectURL(new Blob([out], {type:'text/html'}));
}

/* ---------- уведомления от игр (только для UI) ---------- */
window.addEventListener('message', function(e){
  const m = e.data;
  if (!m || m.source !== 'gamehub') return;
  if (m.gameId !== state.current) return;

  const u = me();
  if (m.type === 'save' && u){
    updateProgressBar(true);
  } else if (m.type === 'reset' && u){
    updateProgressBar(false);
    toast('Прогресс сброшен', 'warn');
  }
});

function updateProgressBar(saved){
  const bar = document.getElementById('progressBar');
  if (!bar) return;
  const u = me();
  if (!u) return;
  bar.classList.add('flash');
  setTimeout(() => bar.classList.remove('flash'), 800);
  const status = bar.querySelector('.status');
  if (status) status.innerHTML = saved
    ? '✅ Прогресс сохранён только что.'
    : 'ℹ️ Прогресс пуст — начните играть!';
}

/* =========================================================
   ДЕМО-ИГРА
   ========================================================= */
const DEMO_HTML = [
'<!DOCTYPE html>',
'<html><head><meta charset="utf-8"><title>Быстрая реакция</title><style>',
'body{margin:0;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;',
'background:radial-gradient(circle at 50% 30%,#241b47,#0b0d13);color:#e8ecf6;',
'font-family:system-ui,sans-serif;user-select:none;overflow:hidden;position:relative}',
'h1{font-size:22px;margin:0 0 6px}p{color:#8b94ad;margin:0 0 14px;font-size:14px}',
'#target{width:110px;height:110px;border-radius:50%;background:linear-gradient(135deg,#6c5ce7,#00d2ff);',
'display:flex;align-items:center;justify-content:center;font-size:34px;cursor:pointer;',
'transition:transform .08s;box-shadow:0 0 40px rgba(108,92,231,.6);position:absolute}',
'#target:active{transform:scale(.9)}',
'.row{display:flex;gap:30px;margin-top:26px;font-size:14px;color:#8b94ad;text-align:center}',
'.row b{display:block;font-size:24px;color:#fff;margin-top:2px}',
'.hint{margin-top:16px;font-size:12px;color:#5a6480;text-align:center;max-width:320px}',
'.saved{color:#4ade80 !important;transition:.2s}',
'</style></head><body>',
'<h1>Быстрая реакция</h1><p>Кликай по кругу — очки сохраняются сразу!</p>',
'<div id="target">🎯</div>',
'<div class="row"><div>Очки<b id="score">0</b></div><div>Рекорд<b id="hi">0</b></div></div>',
'<div class="hint" id="hint">Прогресс сохраняется в аккаунте автоматически</div>',
'<scr'+'ipt>',
'var score=0,hi=0;',
'var t=document.getElementById("target"),s=document.getElementById("score"),',
'    h=document.getElementById("hi"),hint=document.getElementById("hint");',
'function flashSaved(){',
'  hint.textContent="💾 Сохранено!";',
'  hint.classList.add("saved");',
'  setTimeout(function(){hint.textContent="Прогресс сохраняется в аккаунте автоматически";',
'    hint.classList.remove("saved");},900);',
'}',
'function push(){',

'}',
'function move(){t.style.left=(15+Math.random()*70)+"%";t.style.top=(25+Math.random()*55)+"%";}',
'function boot(){',

'    });',

'}',

'else window.addEventListener("gamehub-ready",boot);',
't.onclick=function(){',
'  score++;s.textContent=score;',
'  if(score>hi){hi=score;h.textContent=hi;push();}',
'  move();',
'};',
'move();',
'</scr'+'ipt></body></html>'
].join('\n');

function seed(){
  if (state.games.length === 0){
    const id = 'demo' + uid();
    state.games.push({
      id: id, title: 'Быстрая реакция',

   НАВИГАЦИЯ
   ========================================================= */
function go(view, param){
  if (view === 'game') state.current = param;
  state.view = view;
  render();
}

function onSearch(v){
  state.search = v;
  if (state.view !== 'catalog'){ state.view = 'catalog'; render(); }
  else renderCatalog(document.getElementById('app'));
}

function renderNav(){
  const u = me();
  const nav = document.getElementById('nav');
  const si = document.getElementById('searchInput');
  if (si.value !== state.search) si.value = state.search;

  let html = '<button class="btn ghost sm" onclick="go(\'catalog\')">🏠 Каталог</button>';
  html += '<button class="btn sm" onclick="go(\'upload\')">➕ Загрузить</button>';

  if (u){
    if (u.isDev) html += '<button class="btn warn sm" onclick="go(\'dev\')">🛠 Разработчик</button>';
    html += '<button class="btn ghost sm" onclick="go(\'profile\')">👤 ' + esc(u.login) + '</button>';
  } else {
    html += '<button class="btn ghost sm" onclick="go(\'auth\')">Войти</button>';
  }
  nav.innerHTML = html;
}

function render(){
  renderNav();
  if (currentBlobUrl){ URL.revokeObjectURL(currentBlobUrl); currentBlobUrl = null; }
  const app = document.getElementById('app');

  switch (state.view){
    case 'catalog': renderCatalog(app); break;
    case 'game':    renderGame(app);    break;
    case 'upload':  renderUpload(app);  break;
    case 'auth':    renderAuth(app);    break;
    case 'profile': renderProfile(app); break;
    case 'dev':     renderDev(app);     break;
    default:        renderCatalog(app);
  }
  window.scrollTo(0, 0);
}

function restartGame(){
  const f = document.getElementById('gameFrame');
  if (!f) return;

  if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
  currentBlobUrl = buildGameSrc(html, u ? u.id : null, g.id);

}

function toggleFs(){
  const box = document.getElementById('frameBox');

  else if (box.requestFullscreen) box.requestFullscreen();
}

function confirmResetProgress(gameId){

function setAuthTab(t){ state.authTab = t; renderAuth(document.getElementById('app')); }

function doAuth(){
  const login = document.getElementById('auLogin').value.trim();
  const pass  = document.getElementById('auPass').value;

  if (login.length < 3) return toast('Логин — минимум 3 символа', 'err');
  if (pass.length < 4)  return toast('Пароль — минимум 4 символа', 'err');

  if (state.authTab === 'register'){
    if (state.users.some(u => u.login.toLowerCase() === login.toLowerCase()))
      return toast('Такой логин уже занят', 'err');

    const u = { id: uid(), login: login, pass: hash(pass), isDev: false, createdAt: Date.now() };
    state.users.push(u);
    saveUsers();
    state.session = u.id;
    LS.set('gh_session', u.id);
    toast('Аккаунт создан! Добро пожаловать, ' + login, 'ok');
    go('catalog');
  } else {
    const u = state.users.find(x => x.login.toLowerCase() === login.toLowerCase());
    if (!u || u.pass !== hash(pass)) return toast('Неверный логин или пароль', 'err');
    state.session = u.id;
    LS.set('gh_session', u.id);
    toast('С возвращением, ' + u.login + '!', 'ok');
    go('catalog');
  }
}

function logout(){
  state.session = null;
  LS.set('gh_session', null);
  toast('Вы вышли из аккаунта', 'warn');
  go('catalog');

function readFile(file){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(new Error('Ошибка чтения файла'));
    r.readAsText(file);
  });
}
function readImage(file){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(new Error('Ошибка чтения изображения'));
    r.readAsDataURL(file);
  });
}

async function submitGame(){
  const u = me();
  if (!u) return go('auth');

  const title = document.getElementById('upTitle').value.trim();
  const desc  = document.getElementById('upDesc').value.trim();
  const file  = document.getElementById('upFile').files[0];
  const coverF = document.getElementById('upCover').files[0];

  if (title.length < 2) return toast('Введите название игры', 'err');
  if (!file) return toast('Выберите HTML-файл игры', 'err');
  if (file.size > MAX_HTML_SIZE) return toast('Файл больше 3 МБ', 'err');

  let cover = '';
  if (coverF){
    if (coverF.size > MAX_COVER_SIZE) return toast('Обложка больше 400 КБ', 'err');
    cover = await readImage(coverF);
  }

  const html = await readFile(file);
  if (!/<html|<!doctype|<body|<script|<canvas|<div/i.test(html)){
    if (!confirm('Файл не похож на HTML-игру. Всё равно загрузить?')) return;
  }

  const id = uid();
  try{
    localStorage.setItem('gh_html_' + id, html);
  }catch(e){
    return toast('Не хватает места в хранилище браузера', 'err');
  }

  state.games.push({
    id: id, title: title, desc: desc,
    author: u.login, authorId: u.id, cover: cover,
    status: 'pending', plays: 0, createdAt: Date.now()
  });
  saveGames();

  toast('Игра отправлена на модерацию ✓', 'ok');
  go('profile');
}

        '<div class="cover-mini">' + (g.cover ? '<img src="' + g.cover + '">' : esc((g.title[0] || '?').toUpperCase())) + '</div>' +
        '<div class="dev-item-info">' +
          '<div class="t">' + esc(g.title) + ' <span class="badge ' + st + '">' + label + '</span></div>' +
          '<div class="muted" style="font-size:13px">от <b>' + esc(g.author) + '</b> · ' + fmtDate(g.createdAt) + ' · 🎮 ' + (g.plays || 0) + '</div>' +
        '</div>' +
        '<div class="dev-item-actions">' +
          (g.status === 'approved' ? '<button class="btn ghost sm" onclick="openGame(\'' + g.id + '\')">▶ Играть</button>' : '') +
          (g.status !== 'approved' ? '<button class="btn ok sm" onclick="approveGame(\'' + g.id + '\')">✅ Принять</button>' : '') +
          (g.status !== 'rejected' ? '<button class="btn warn sm" onclick="rejectGame(\'' + g.id + '\')">❌ Отклонить</button>' : '') +
          '<button class="btn err sm" onclick="deleteGame(\'' + g.id + '\')">🗑 Удалить</button>' +
        '</div>' +
      '</div>';
    }).join('') : '<div class="empty">Игр нет</div>';
  }

  if (state.devTab === 'users'){
    body = '<div class="panel wide" style="padding:8px 20px"><table>' +
      '<tr><th>Логин</th><th>Роль</th><th>Игр</th><th>Сохранений</th><th>Регистрация</th><th></th></tr>' +
      state.users.map(u => {
        const cnt = state.games.filter(g => g.authorId === u.id).length;
        let savedTotal = 0;
        state.games.forEach(g => {
          try{ if (localStorage.getItem(progressKey(u.id, g.id)) !== null) savedTotal++; }catch(e){}
        });
        return '<tr>' +
          '<td><b>' + esc(u.login) + '</b></td>' +
          '<td>' + (u.isDev ? '<span class="badge dev">🛠 Разработчик</span>' : '<span class="muted">Игрок</span>') + '</td>' +
          '<td>' + cnt + '</td>' +
          '<td>' + (savedTotal ? '💾 ' + savedTotal : '<span class="muted">—</span>') + '</td>' +
          '<td class="muted">' + fmtDate(u.createdAt) + '</td>' +
          '<td style="text-align:right">' +
            (u.id !== state.session
              ? '<button class="btn err sm" onclick="deleteUser(\'' + u.id + '\')">Удалить</button>'
              : '<span class="muted" style="font-size:12px">это вы</span>') +
          '</td>' +
        '</tr>';
      }).join('') +
    '</table></div>';
  }

  app.innerHTML =
    '<div class="sec-head">' +
      '<div><h1 style="margin:0">Панель разработчика</h1>' +
      '<div class="muted">Управление играми и пользователями платформы</div></div>' +
      '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
        '<span class="badge approved">Опубликовано: ' + approved.length + '</span>' +
        '<span class="badge pending">На модерации: ' + pending.length + '</span>' +
        '<span class="badge rejected">Отклонено: ' + rejected.length + '</span>' +
        '<button class="btn ghost sm" onclick="exitDevMode()">Выйти из режима</button>' +
      '</div>' +
    '</div>' +
    tabs + body;
}

function setDevTab(t){ state.devTab = t; renderDev(document.getElementById('app')); }

function exitDevMode(){
  const u = me();
  if (!u) return;
  u.isDev = false;
  saveUsers();
  toast('Режим разработчика выключен', 'warn');
  go('profile');
}

function approveGame(id){
  const g = getGame(id);
  if (!g) return;
  g.status = 'approved';
  saveGames();
  toast('Игра «' + g.title + '» опубликована ✓', 'ok');
  renderDev(document.getElementById('app'));
  renderNav();
}

function rejectGame(id){
  const g = getGame(id);
  if (!g) return;
  g.status = 'rejected';
  saveGames();
  toast('Игра «' + g.title + '» отклонена', 'warn');
  renderDev(document.getElementById('app'));
  renderNav();
}

function deleteGame(id, own){
  const g = getGame(id);
  if (!g) return;
  if (!own && !isDev()) return toast('Нет прав', 'err');
  if (own && g.authorId !== state.session && !isDev()) return toast('Нет прав', 'err');
  if (!confirm('Удалить игру «' + g.title + '» навсегда?')) return;

  state.games = state.games.filter(x => x.id !== id);
  saveGames();
  try{ localStorage.removeItem('gh_html_' + id); }catch(e){}

  const toRemove = [];
  for (let i = 0; i < localStorage.length; i++){
    const k = localStorage.key(i);
    if (k && k.indexOf('gh_progress_') === 0 && k.endsWith('_' + id)) toRemove.push(k);
  }
  toRemove.forEach(k => { try{ localStorage.removeItem(k); }catch(e){} });

  toast('Игра удалена', 'warn');
  if (state.view === 'dev') renderDev(document.getElementById('app'));
  else render();
  renderNav();
}

function deleteUser(id){
  const u = state.users.find(x => x.id === id);
  if (!u) return;
  if (!confirm('Удалить пользователя «' + u.login + '» и все его игры?')) return;

  state.games.filter(g => g.authorId === id).forEach(g => {
    try{ localStorage.removeItem('gh_html_' + g.id); }catch(e){}
  });
  state.games = state.games.filter(g => g.authorId !== id);
  state.users = state.users.filter(x => x.id !== id);

  const toRemove = [];
  for (let i = 0; i < localStorage.length; i++){
    const k = localStorage.key(i);
    if (k && k.indexOf('gh_progress_' + id + '_') === 0) toRemove.push(k);
  }
  toRemove.forEach(k => { try{ localStorage.removeItem(k); }catch(e){} });

  saveGames();
  saveUsers();
  toast('Пользователь удалён', 'warn');
  renderDev(document.getElementById('app'));
  renderNav();
}

/* =========================================================
   СТАРТ
   ========================================================= */
(function init(){
  if (state.session && !state.users.some(u => u.id === state.session)){
    state.session = null;
    LS.set('gh_session', null);
  }
  render();
})();
</script>
</body>
</html>
